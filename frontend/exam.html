<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفة الكشف — الروشتة والتشخيص</title>
  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="shared/shared.css?v=2.0">
  <!-- Page Specific Stylesheet (Uses patients styles like SOAP) -->
  <link rel="stylesheet" href="shared/patients.css?v=2.0">
</head>
<body class="clinic-body">
  <div class="clinic-layout">
    <!-- Sidebar is dynamically injected here by shared.js -->
    <main class="clinic-main" id="clinic-main">
      <div class="view-header">
        <div>
          <h1><i class="fa-solid fa-stethoscope"></i> غرفة الكشف</h1>
          <p class="view-subtitle" id="exam-patient-info">تحميل بيانات المريض...</p>
        </div>
        <div class="view-header-actions">
          <button class="btn-sm btn-outline" onclick="location.href='dashboard.html'">
            <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
          </button>
        </div>
      </div>

      <div class="soap-grid">
        <!-- S: Subjective -->
        <div class="soap-card">
          <div class="soap-header soap-s"><span>S</span> شكوى المريض (Subjective)</div>
          <div class="soap-body">
            <textarea id="soap-subjective" placeholder="اكتب شكوى المريض والتاريخ المرضي هنا..." rows="5"></textarea>
          </div>
        </div>
        <!-- O: Objective -->
        <div class="soap-card">
          <div class="soap-header soap-o"><span>O</span> الفحص السريري (Objective)</div>
          <div class="soap-body">
            <div class="vitals-grid">
              <div class="vital-field">
                <label>ضغط الدم</label>
                <input type="text" id="soap-bp" placeholder="120/80">
              </div>
              <div class="vital-field">
                <label>النبض</label>
                <input type="number" id="soap-pulse" placeholder="72">
              </div>
              <div class="vital-field">
                <label>الحرارة</label>
                <input type="number" step="0.1" id="soap-temp" placeholder="37.0">
              </div>
              <div class="vital-field">
                <label>الوزن (كجم)</label>
                <input type="number" step="0.1" id="soap-weight" placeholder="70">
              </div>
            </div>
          </div>
        </div>
        <!-- A: Assessment -->
        <div class="soap-card">
          <div class="soap-header soap-a"><span>A</span> التشخيص (Assessment)</div>
          <div class="soap-body">
            <input type="text" id="soap-diagnosis" placeholder="ابحث عن كود ICD-11 أو اكتب التشخيص..." class="soap-input">
            <textarea id="soap-assessment-notes" placeholder="ملاحظات التشخيص الإضافية..." rows="3"></textarea>
          </div>
        </div>
        <!-- P: Plan -->
        <div class="soap-card">
          <div class="soap-header soap-p"><span>P</span> الخطة العلاجية (Plan)</div>
          <div class="soap-body">
            <textarea id="soap-plan" placeholder="اكتب الخطة العلاجية هنا..." rows="3"></textarea>
          </div>
        </div>
      </div>

      <!-- E-Prescription -->
      <div class="clinic-card">
        <div class="card-header">
          <h2><i class="fa-solid fa-prescription-bottle-medical"></i> الروشتة الإلكترونية</h2>
          <button class="btn-sm btn-outline" onclick="addPrescriptionRow()">
            <i class="fa-solid fa-plus"></i> إضافة دواء
          </button>
        </div>
        <div class="table-responsive">
          <table class="clinic-table" id="prescription-table">
            <thead>
              <tr>
                <th>اسم الدواء</th>
                <th>الجرعة</th>
                <th>المدة</th>
                <th>تعليمات</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="prescription-body">
              <!-- Rows added dynamically by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Exam Actions -->
      <div class="action-row">
        <button class="btn-primary-cta" onclick="saveConsultation()">
          <i class="fa-solid fa-save"></i> حفظ الزيارة والروشتة
        </button>
        <button class="btn-sm btn-outline" onclick="printPrescription()">
          <i class="fa-solid fa-print"></i> طباعة الروشتة
        </button>
      </div>
    </main>
  </div>

  <!-- Shared & Specific JS Scripts -->
  <script src="shared/shared.js"></script>
  <script src="exam.js"></script>
</body>
</html>
