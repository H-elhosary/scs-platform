<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم العيادة — صندوق الوارد</title>
  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="shared/shared.css?v=2.0">
  <!-- Page Specific Stylesheet -->
  <link rel="stylesheet" href="shared/inbox.css?v=2.0">
</head>
<body class="clinic-body">
  <div class="clinic-layout">
    <!-- Sidebar is dynamically injected here by shared.js -->
    <main class="clinic-main clinic-main--flush" id="clinic-main">
      <div class="chat-container">
        <!-- Chat Sidebar (conversations) -->
        <div class="chat-sidebar">
          <div class="chat-sidebar-header">
            <h2>المحادثات المفتوحة</h2>
          </div>
          <div class="chat-conversations-list" id="chat-conversations-list">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-window" id="chat-window">
          <!-- Rendered dynamically by JS depending on selected conversation -->
          <div class="chat-empty-state">
            <i class="fa-solid fa-comments fa-3x"></i>
            <p>يرجى اختيار محادثة من القائمة للبدء بالدردشة والتواصل مع المريض.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Shared & Specific JS Scripts -->
  <script src="shared/shared.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
