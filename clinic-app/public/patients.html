<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم العيادة — المرضى</title>
  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Design System -->
  <link rel="stylesheet" href="core/core.css">
  <!-- Page Specific Stylesheet -->
  <link rel="stylesheet" href="pages/patients/patients.css">
</head>
<body class="clinic-body">
  <div class="clinic-layout">
    <!-- Sidebar is dynamically injected here by shared.js -->
    <main class="clinic-main" id="clinic-main">
      <div class="view-header">
        <div>
          <h1>إدارة بيانات المرضى</h1>
          <p class="view-subtitle">استعراض السجلات الطبية والملفات الشخصية</p>
        </div>
        <div class="view-header-actions">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="patient-search-input" placeholder="ابحث باسم المريض أو رقم الهاتف..." oninput="filterPatientsList()">
          </div>
          <button class="btn-primary-cta" onclick="showAddPatientModal()">
            <i class="fa-solid fa-user-plus"></i> إضافة مريض
          </button>
        </div>
      </div>

      <div class="clinic-card">
        <div class="table-responsive">
          <table class="clinic-table" id="patients-table">
            <thead>
              <tr>
                <th>اسم المريض</th>
                <th>رقم الهاتف</th>
                <th>العمر</th>
                <th>الجنس</th>
                <th>البريد الإلكتروني</th>
                <th>آخر زيارة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="patients-list-body">
              <tr><td colspan="7" class="loading-cell"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Patient Profile Slide-over -->
      <div class="slide-over-panel" id="patient-profile-panel">
        <div class="slide-over-backdrop" onclick="closePatientProfile()"></div>
        <div class="slide-over-content">
          <div class="slide-over-header">
            <h2 id="patient-profile-name">ملف المريض</h2>
            <button class="btn-icon" onclick="closePatientProfile()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="slide-over-body" id="patient-profile-body">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== MODAL: Add Patient ===== -->
  <div class="modal-overlay" id="modal-add-patient">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-user-plus"></i> إضافة مريض جديد</h2>
        <button class="btn-icon" onclick="closeModal('modal-add-patient')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="add-patient-form" onsubmit="submitNewPatient(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>الاسم بالكامل *</label>
              <input type="text" id="new-patient-name" required placeholder="مثال: أحمد محمد حسن">
            </div>
            <div class="form-group">
              <label>رقم الهاتف *</label>
              <input type="tel" id="new-patient-phone" required placeholder="+201012345678">
            </div>
            <div class="form-group">
              <label>السن</label>
              <input type="number" id="new-patient-age" placeholder="30">
            </div>
            <div class="form-group">
              <label>الجنس</label>
              <select id="new-patient-gender">
                <option value="">— اختر —</option>
                <option value="male">ذكر</option>
                <option value="female">أنثى</option>
              </select>
            </div>
            <div class="form-group">
              <label>البريد الإلكتروني</label>
              <input type="email" id="new-patient-email" placeholder="example@email.com">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-cta" onclick="closeModal('modal-add-patient')">إلغاء</button>
            <button type="submit" class="btn-primary-cta"><i class="fa-solid fa-user-plus"></i> إضافة المريض</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Shared & Specific JS Scripts -->
  <script src="core/api.js"></script>
  <script src="core/shared.js"></script>
  <script src="patients.js"></script>
</body>
</html>
