<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الباقات — لوحة عمليات المنصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="core/core.css">
</head>
<body class="clinic-body">
  <div class="clinic-layout">
    <main class="clinic-main">

      <div class="view-header">
        <div>
          <h1><i class="fa-solid fa-gem"></i> إدارة وتهيئة الباقات</h1>
          <p class="view-subtitle">تخصيص أسعار باقات الاشتراك بالجنيه والدولار، وتحديد الصلاحيات الافتراضية لكل خطة.</p>
        </div>
        <div class="view-header-actions">
          <button type="button" id="btn-add-new-plan" class="btn-primary"><i class="fa-solid fa-plus"></i> إضافة باقة جديدة</button>
        </div>
      </div>

      <div id="alert-panel" class="alert-box hide"><div class="alert-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="alert-msg" id="alert-msg"></div></div>

      <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
        <div style="flex:2; min-width:460px; display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px;" id="ops-plans-cards-container">
          <div class="text-center" style="grid-column:1/-1; padding:40px; color:var(--scs-text-muted);">جاري تحميل الباقات...</div>
        </div>

        <div id="plan-config-sidebar" class="table-card hide" style="flex:1; min-width:320px; padding:22px; height:fit-content; position:sticky; top:24px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--scs-border); padding-bottom:10px;">
            <h3 id="plan-form-title" style="margin:0; font-size:15px; font-weight:700; color:var(--scs-text-heading); display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-pen-to-square" style="color:var(--primary);"></i> تهيئة وتعديل الباقة</h3>
            <button type="button" id="btn-close-plan-config" style="background:none; border:none; font-size:22px; cursor:pointer; color:var(--scs-text-dim); line-height:1;">&times;</button>
          </div>
          <form id="ops-plan-config-form">
            <input type="hidden" id="plan-id">
            <div class="form-group" style="margin-bottom:14px;">
              <label for="plan-name-input">اسم الباقة</label>
              <input type="text" id="plan-name-input" readonly style="background:var(--scs-bg-hover); cursor:not-allowed;">
            </div>
            <div class="form-grid" style="margin-bottom:14px;">
              <div class="form-group"><label for="plan-price-usd">السعر بالدولار ($)</label><input type="number" id="plan-price-usd" required min="0"></div>
              <div class="form-group"><label for="plan-price-egp">السعر بالجنيه (EGP)</label><input type="number" id="plan-price-egp" required min="0"></div>
            </div>

            <h4 style="font-size:12.5px; font-weight:700; color:var(--scs-text-heading); margin:16px 0 10px;">تفعيل صلاحيات الباقة الافتراضية:</h4>
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-multi-doctor"><span class="slider"></span></span> أطباء متعددون (Multi-Doctor)</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-insurance"><span class="slider"></span></span> التأمين الطبي (Insurance)</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-refunds"><span class="slider"></span></span> الاسترداد التلقائي (Auto-Refunds)</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-whatsapp"><span class="slider"></span></span> تنبيهات الواتساب</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-telegram"><span class="slider"></span></span> بوت التليجرام</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-analytics"><span class="slider"></span></span> التقارير والتحليلات</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-voice-bot"><span class="slider"></span></span> الحجز الصوتي الذكي</label>
              <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; color:var(--scs-text);"><span class="switch-toggle"><input type="checkbox" id="plan-feat-branding"><span class="slider"></span></span> الهوية المخصصة</label>
            </div>

            <div style="display:flex; gap:10px;">
              <button type="submit" class="btn-primary" id="plan-config-submit-btn" style="flex:2; justify-content:center;"><span class="btn-text">حفظ خصائص الباقة</span><div class="spinner hide"></div></button>
              <button type="button" class="btn-outline-cta" id="plan-config-delete-btn" style="flex:1; display:none; color:var(--scs-danger); border-color:#fecaca; justify-content:center;"><i class="fa-solid fa-trash"></i> حذف</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="core/ops-shared.js"></script>
  <script src="admin.js"></script>
</body>
</html>
